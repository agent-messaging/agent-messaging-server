name: Scenarios

# Business scenarios against the server built from this commit, on each broker.
#   pull requests   that touch the server, the SDK or a scenario: quick delays
#   nightly         a shipment two hours after the order
#   by hand         your own delays
on:
  pull_request:
    paths:
      - "server/**"
      - "sdk-typescript/**"
      - "deploy/compose/**"
      - "scenarios/**"
      - ".github/workflows/scenarios.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ship_delay_ms:
        description: "From order to shipment, in ms"
        default: "8000"
      offline_window_ms:
        description: "How long an agent stays offline in T9 and T9b, in ms"
        default: "4000"

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  laptop-purchase:
    name: laptop purchase (${{ matrix.broker }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 200 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        broker: [nats, rabbitmq]
    env:
      CI: "1"
      SHIP_DELAY_MS: ${{ github.event_name == 'schedule' && '7200000' || inputs.ship_delay_ms || '8000' }}
      OFFLINE_WINDOW_MS: ${{ github.event_name == 'schedule' && '600000' || inputs.offline_window_ms || '4000' }}
      TEST_TIMEOUT_MS: ${{ github.event_name == 'schedule' && '9000000' || '180000' }}
      # The images built from this commit, not the release compose.yaml pins.
      # The steps that run Compose do so in deploy/compose/<broker>.
      COMPOSE_FILE: compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bring the mesh up from empty
        working-directory: deploy/compose/${{ matrix.broker }}
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 300

      - name: Install the SDK and the scenario
        run: |
          (cd sdk-typescript && npm ci --no-audit --no-fund && npm run build)
          (cd scenarios/laptop-purchase && npm ci --no-audit --no-fund && npm run typecheck)

      - name: The laptop purchase scenario
        run: node scenarios/laptop-purchase/run.mjs ${{ matrix.broker }} --exclude tests/deferred-task-timing.test.ts

      # The RabbitMQ deferred-result race was fixed in server 0.2.1 and SDK
      # 0.61.1; this step is required on both brokers.
      - name: Deferred task timing
        run: node scenarios/laptop-purchase/run.mjs ${{ matrix.broker }} tests/deferred-task-timing.test.ts --outputFile.junit .state/junit-timing-${{ matrix.broker }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laptop-purchase-${{ matrix.broker }}
          path: scenarios/laptop-purchase/.state/junit-*.xml
          if-no-files-found: ignore

      - name: Logs, on failure
        if: failure()
        working-directory: deploy/compose/${{ matrix.broker }}
        run: docker compose logs --tail 200 server

      - name: Stop the mesh
        if: always()
        working-directory: deploy/compose/${{ matrix.broker }}
        run: docker compose down -v
