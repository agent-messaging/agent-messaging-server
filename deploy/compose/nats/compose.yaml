# The Agent Messaging Server on NATS JetStream: one host, one command.
#
#   docker compose up -d
#
# What starts, in order:
#   setup        first-run setup, once: the operator, the signing keys, the
#                broker's settings and the first admin token, in the volume
#                `config`. On every later start it changes nothing and exits.
#   nats         NATS 2.10 on the settings first-run wrote (operator mode, the
#                full resolver, JetStream, WebSocket on 4443).
#   server       the Agent Messaging Server: the core services, the credential
#                doors and the admin API on 3005.
#   a2a-gateway  the A2A gateway on 8090, on the credential first-run made.
#
# Every port is published on 127.0.0.1 only, unless BIND_ADDRESS says
# otherwise (.env.example). README.md in this folder says how to use it.

name: agent-messaging-nats

services:
  setup:
    image: ${SERVER_IMAGE:-agent-messaging-server:local}
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    command: ["first-run"]
    environment:
      MESH_NAME: ${MESH_NAME:-agent-messaging}
      # The addresses agents are given with their credentials.
      MESH_NATS_ENDPOINTS: ${MESH_NATS_ENDPOINTS:-nats://localhost:${NATS_PORT:-4222},ws://localhost:${NATS_WS_PORT:-4443}}
      MESH_PUBLIC_URL: ${MESH_PUBLIC_URL:-http://localhost:${SERVER_PORT:-3005}}
    volumes:
      - config:/config
    restart: "no"

  nats:
    image: nats:2.10.24-alpine
    command: ["-c", "/config/nats/nats.conf"]
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - config:/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NATS_PORT:-4222}:4222"
      - "${BIND_ADDRESS:-127.0.0.1}:${NATS_WS_PORT:-4443}:4443"
    healthcheck:
      # The monitoring port listens on the container's loopback only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  server:
    image: ${SERVER_IMAGE:-agent-messaging-server:local}
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      # Bring your own identity (SPEC §4.14 to §4.16): the bridge fronts the
      # capabilities answer names, the other address this host reaches the
      # server at, and MESH_TRUST_ALLOW_HTTP=on only for a test issuer over http.
      MESH_BRIDGE_HTTPS_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8090}}/v1/bridge/tools
      MESH_BRIDGE_MCP_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8090}}/mcp
      MESH_PUBLIC_ORIGINS: http://127.0.0.1:${SERVER_PORT:-3005}
      MESH_TRUST_ALLOW_HTTP: ${MESH_TRUST_ALLOW_HTTP:-off}
    # The host machine, as issuer.test, for a test issuer the identity tests
    # and example 08 run on it (Docker's host-gateway).
    extra_hosts:
      - "issuer.test:host-gateway"
    volumes:
      - config:/config
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-3005}:3005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/v1/capabilities').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  a2a-gateway:
    image: ${GATEWAY_IMAGE:-agent-messaging-a2a-gateway:local}
    build:
      context: ../../..
      dockerfile: a2a-gateway/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      MESH_URL: ws://nats:4443
      CREDS_FILE: /config/creds/a2a-gateway.creds
      PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8090}}
      # key=label pairs for A2A callers; with none, every inbound call is refused.
      API_KEYS: ${GATEWAY_API_KEYS:-}
      # Where outside proofs (OAuth tokens, SPIFFE JWT-SVIDs) are checked: the server's doors.
      CORE_API_URL: http://server:3005
      ATTACH: ${GATEWAY_ATTACH:-}
    volumes:
      - config:/config:ro
      - gateway-data:/app/a2a-gateway/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(async (r) => process.exit(r.ok && (await r.json()).ready ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

volumes:
  # Everything first-run made, and the broker's data. The one volume to back up.
  config:
  gateway-data:
